<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[图表标题] · Diagram View</title>
  <!-- 引入字体：LXGW WenKai (正文/标题/图表) + JetBrains Mono (代码块/等宽) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #f4f5f7;              /* 页面主背景 */
      --color-paper-card:  #ffffff;              /* 卡片背景 */
      --color-ink:         #1d2129;              /* 正文/描边 */
      --color-muted:       #374151;              /* 次要文字 / 默认连线 */
      --color-soft:        #57606a;              /* 辅助说明 */
      --color-rule:        rgba(30,41,59, 0.12); /* 细线 */
      --color-accent:      #d9531e;              /* 焦点色 */
      --color-accent-tint: rgba(217,83,30, 0.08);
      --color-link:        #275296;

      --font-chinese: 'LXGW WenKai', sans-serif;
      --font-english: 'LXGW WenKai', sans-serif;
      --font-body:    'LXGW WenKai', sans-serif;
      --font-display: 'LXGW WenKai', serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-body);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 2.5vw + 0.8rem, 2.2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    .diagram-box {
      background: var(--color-paper-card);
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      padding: 1.5rem;
      overflow-x: auto;
    }

    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">[类型] · DIAGRAM VIEW</p>
    <h1>[图表标题]</h1>

    <div class="diagram-box">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">架构示意图</title>
        <desc id="diagram-desc">展示系统拓扑或流程流转示意</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#374151"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d9531e"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#275296"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f4f5f7" rx="4"/>

        <!-- 1. 连线层 -->

        <!-- 2. 节点层 -->

        <!-- 3. 图例层 (可选) -->
      </svg>
    </div>
  </div>
</body>
</html>
