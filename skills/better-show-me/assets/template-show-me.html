<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- 在 title 中填写当前主题。 -->
  <title></title>

  <!-- 页面底座：保留样式与资源，按当前事实填写正文。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Ysabeau+Office:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body, h1, h2, h3, p, figure, ol, ul { margin: 0; }

    :root {
      --color-paper: #f4f5f7;
      --color-paper-card: #ffffff;
      --color-paper-code: #eaedf2;
      --color-ink: #1d2129;
      --color-muted: #374151;
      --color-soft: #57606a;
      --color-rule: rgba(30,41,59,.14);
      --color-rule-solid: rgba(55,65,81,.28);
      --color-accent: #d9531e;
      --color-accent-tint: rgba(217,83,30,.09);
      --color-link: #275296;
      --color-success-text: #1e7e34;
      --color-success-bg: rgba(40,167,69,.10);
      --color-danger-text: #c82333;
      --color-danger-bg: rgba(220,53,69,.08);
      --font-body: 'Ysabeau Office','LXGW WenKai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --font-display: 'Ysabeau Office','LXGW WenKai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --font-mono: 'JetBrains Mono','LXGW WenKai','LXGW WenKai Mono',ui-monospace,Menlo,Consolas,monospace;
      --page: 1320px;
      --gap: 20px;
      --radius: 7px;
    }

    body {
      min-height: 100vh;
      background: var(--color-paper);
      color: var(--color-ink);
      font: 400 16px/1.65 var(--font-body);
    }
    code, pre { font-family: var(--font-mono); }
    code { font-size: .88em; }
    h1 code, h2 code, h3 code { font-size: inherit; }
    .page { width: min(var(--page), calc(100% - 48px)); margin: 0 auto; }
    .shell { display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 28px; }
    .content { min-width: 0; }

    /* CONTRAST · one typographic ladder, one accent, one dominant surface. */
    .header { max-width: 900px; padding: 74px 0 50px 76px; }
    .eyebrow { margin-bottom: 14px; color: var(--color-accent); font: 600 .72rem/1.2 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 850px; margin-bottom: 18px; font: 600 clamp(2.2rem,4.5vw,3.5rem)/1.08 var(--font-display); letter-spacing: -.025em; }
    h1 code { color: var(--color-accent); font-size: inherit; font-weight: 600; }
    .lede { max-width: 760px; color: var(--color-muted); font-size: 1.1rem; line-height: 1.75; }

    /* CONTEXT STRIP · async context anchoring for external sharing. */
    .context-strip { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px 32px; margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--color-rule-solid); }
    .context-item { min-width: 0; }
    .context-label { display: block; margin-bottom: 4px; color: var(--color-soft); font: 600 .72rem/1.3 var(--font-mono); letter-spacing: .04em; }
    .context-value { display: block; color: var(--color-muted); font-size: .84rem; line-height: 1.55; overflow-wrap: anywhere; }
    .context-value code { font-size: .88em; }

    /* REPETITION · navigation stays in a quiet side rail, outside the reading canvas. */
    .side-nav { position: sticky; top: 32px; align-self: start; margin-top: 180px; }
    .side-nav a { display: grid; grid-template-columns: 27px 1fr; align-items: baseline; padding: 10px 0 10px 12px; color: var(--color-muted); border-left: 1px solid var(--color-rule); text-decoration: none; font-size: .84rem; line-height: 1.35; }
    .side-nav a:hover { color: var(--color-ink); border-left-color: var(--color-accent); }
    .side-nav a:focus-visible { color: var(--color-ink); border-left-color: var(--color-accent); outline: 2px solid rgba(217,83,30,.25); outline-offset: 3px; }
    .side-nav strong { color: var(--color-soft); font: 600 .72rem/1.2 var(--font-mono); }
    .side-nav span { color: var(--color-muted); font-weight: 600; }
    .side-nav a:hover span,.side-nav a:focus-visible span { color: var(--color-ink); }

    /* ALIGNMENT · every chapter uses the same number rail and 12-column body. */
    .chapter { display: grid; grid-template-columns: 56px repeat(12,minmax(0,1fr)); gap: 0 var(--gap); padding: 76px 0 86px; border-top: 1px solid var(--color-rule); }
    .chapter-follow { padding-top: 64px; }
    .act-start { margin-top: 28px; padding-top: 92px; border-top-color: var(--color-rule-solid); }
    .chapter-no { grid-column: 1; padding-top: 7px; color: var(--color-soft); font: 500 .72rem/1 var(--font-mono); }
    .chapter-head { grid-column: 2 / span 8; margin-bottom: 40px; }
    .chapter-head h2 { margin-bottom: 9px; font: 600 clamp(1.55rem,2.4vw,2.05rem)/1.24 var(--font-display); letter-spacing: -.012em; }
    .chapter-head h2 code { color: var(--color-accent); font-size: inherit; font-weight: 600; }
    .chapter-head p { max-width: 670px; color: var(--color-soft); font-size: .96rem; }
    .chapter-body { grid-column: 2 / -1; min-width: 0; }
    .grid-7-5 { display: grid; grid-template-columns: minmax(0,7fr) minmax(300px,5fr); gap: clamp(42px,6vw,76px); align-items: start; }
    .grid-6-6 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: clamp(42px,5vw,64px); align-items: start; }
    .change-layout { display: grid; grid-template-columns: minmax(320px,.78fr) minmax(500px,1.22fr); gap: clamp(42px,5vw,64px); align-items: start; }
    .grid-7-5 > *,.grid-6-6 > *,.change-layout > * { min-width: 0; }

    /* PROXIMITY · every figure names the question it answers, then keeps evidence attached. */
    .figure-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .figure-head h3 { font: 600 1.04rem/1.35 var(--font-display); }
    .source { color: var(--color-soft); font: 500 .72rem/1.4 var(--font-mono); white-space: nowrap; }
    a.source { color: var(--color-link); }
    .caption { margin-top: 14px; color: var(--color-soft); font-size: .82rem; }

    /* PATTERN: expected/actual fork | dominant relationship for diagnosis. */
    .hero-surface { padding: 34px 30px 22px; overflow-x: auto; background: rgba(255,255,255,.66); border: 1px solid var(--color-rule); border-radius: var(--radius); }
    .hero-surface:focus-visible,.diagram-wrap:focus-visible { outline: 2px solid rgba(217,83,30,.28); outline-offset: 3px; }
    .hero-surface svg { display: block; width: 100%; min-width: 900px; }
    .hero-surface text { font-family: var(--font-body); }
    .hero-surface .mono { font-family: var(--font-mono); }

    /* PATTERN: causal chain | explains propagation, not chronology. */
    .causal { list-style: none; padding: 0; }
    .causal li { position: relative; padding: 0 0 27px 30px; color: var(--color-muted); font-size: .9rem; }
    .causal li:not(:last-child)::before { content: ''; position: absolute; left: 6px; top: 18px; bottom: 2px; border-left: 1px solid var(--color-rule-solid); }
    .causal li::after { content: ''; position: absolute; left: 2px; top: 8px; width: 8px; height: 8px; border: 1px solid var(--color-muted); border-radius: 50%; background: var(--color-paper); }
    .causal li.focus::after { border-color: var(--color-accent); background: var(--color-accent); }
    .causal strong { display: block; margin-bottom: 3px; color: var(--color-ink); font-size: .94rem; }
    .anchor { display: block; margin-top: 5px; color: var(--color-link); font: 500 .68rem/1.4 var(--font-mono); }

    /* DIAGRAM: sequence | control moves across runtime boundaries. */
    .diagram-wrap { overflow-x: auto; background: rgba(255,255,255,.58); border: 1px solid var(--color-rule); border-radius: 6px; }
    .sequence-focus { width: 100%; }
    .sequence-diagram { padding: 13px 10px 5px; }
    .sequence-diagram svg { display: block; width: 100%; min-width: 780px; }
    .sequence-diagram text { font-family: var(--font-body); }
    .sequence-diagram .mono { font-family: var(--font-mono); }

    /* PATTERN: data transformation | fields change across stages. */
    .transform { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: stretch; }
    .transform-node { padding: 17px; background: var(--color-paper-card); border: 1px solid var(--color-rule-solid); border-radius: 5px; }
    .transform-node.focus { border-color: var(--color-accent); background: var(--color-accent-tint); }
    .transform-node strong { display: block; margin-bottom: 8px; font: 600 .76rem/1.35 var(--font-mono); }
    .transform-node p { color: var(--color-muted); font: 500 .72rem/1.6 var(--font-mono); }
    .shape-key { color: var(--color-link); }
    .shape-value { color: var(--color-success-text); }
    .transform-node.focus .shape-key,.transform-node.focus .shape-value { color: var(--color-accent); }
    .transform-arrow { align-self: center; color: var(--color-accent); font-family: var(--font-mono); }

    /* PATTERN: call/component hierarchy | ownership and depth determine behavior. */
    .tree { padding: 20px; color: var(--color-muted); background: var(--color-paper-code); border: 1px solid var(--color-rule); border-radius: 5px; white-space: pre-wrap; font-size: .73rem; line-height: 1.75; }
    .tree .tree-focus { color: var(--color-accent); font-weight: 600; }
    .tree code { font: inherit; }
    .structure-tree .tree-call { color: var(--color-link); }
    .structure-tree .tree-owner { color: var(--color-ink); font-weight: 600; }
    .structure-tree .tree-component { color: var(--color-link); font-weight: 500; }
    .structure-tree .tree-role { color: var(--color-soft); font-style: italic; }
    .file-tree .tree-root { color: var(--color-ink); font-weight: 600; }
    .file-tree .tree-file { color: var(--color-link); }
    .file-tree .tree-impact { color: var(--color-soft); }
    .file-tree .tree-note { color: var(--color-soft); font-style: italic; }

    /* Highlight.js · syntax colors resolve to the existing semantic tokens. */
    pre.tree code.hljs { display: block; padding: 0; overflow: visible; background: transparent; color: var(--color-ink); }
    .hljs-keyword,.hljs-selector-tag,.hljs-meta { color: var(--color-link); font-weight: 600; }
    .hljs-title.function_ { color: var(--color-ink); }
    .hljs-title.class_,.hljs-type,.hljs-built_in { color: var(--color-link); }
    .hljs-attr,.hljs-property,.hljs-variable,.hljs-params { color: #475569; }
    .hljs-string,.hljs-symbol { color: var(--color-success-text); }
    .hljs-number,.hljs-literal { color: var(--color-accent); }
    .hljs-comment,.hljs-quote { color: var(--color-soft); font-style: italic; }
    .code-focus { color: var(--color-accent) !important; font-weight: 700; }

    /* PATTERN: blast radius | propagation plus stable boundary. */
    /* PATTERN: semantic diff | syntax is the evidence. */
    .code-panel { overflow: hidden; background: var(--color-paper-code); border: 1px solid var(--color-rule); border-radius: 6px; }
    .code-bar { display: flex; justify-content: space-between; padding: 11px 15px; color: var(--color-soft); border-bottom: 1px solid var(--color-rule); font: 500 .7rem/1.4 var(--font-mono); }
    pre { overflow-x: auto; margin: 0; padding: 18px; font: 400 .75rem/1.72 var(--font-mono); }
    .del,.add { display: block; margin: 1px -5px; padding: 0 5px; }
    .del { color: var(--color-danger-text); background: var(--color-danger-bg); text-decoration: line-through; }
    .add { color: var(--color-success-text); background: var(--color-success-bg); }

    /* PATTERN: structural UI layout wireframe | reveals spatial zones and component/node layout. */
    .ui-frame { padding: 13px; background: var(--color-paper-code); border: 1px solid var(--color-rule); border-radius: 6px; }
    .ui-window { overflow: hidden; background: var(--color-paper-card); border: 1px solid var(--color-rule-solid); border-radius: 5px; }
    .ui-shell { display: grid; grid-template-columns: 120px minmax(0,1fr); min-height: 210px; }
    .ui-sidebar { display: flex; flex-direction: column; gap: 8px; padding: 16px 12px; border-right: 1px solid var(--color-rule); background: rgba(234,237,242,.55); }
    .ui-skeleton-item { height: 20px; background: rgba(30,41,59,.06); border: 1px dashed var(--color-rule-solid); border-radius: 3px; }
    .ui-main { min-width: 0; padding: 16px 18px; }
    .ui-stack { display: flex; flex-direction: column; gap: 9px; }
    .ui-node { padding: 10px 12px; border-radius: 4px; }
    .ui-node strong { display: block; font: 500 .72rem/1.35 var(--font-mono); }
    .ui-node.existing { background: rgba(234,237,242,.45); border: 1px dashed var(--color-rule-solid); }
    .ui-node.existing strong { color: var(--color-soft); }
    .ui-node.added { background: var(--color-accent-tint); border: 1.5px solid var(--color-accent); }
    .ui-node.added strong { color: var(--color-accent); font-weight: 600; }

    /* PATTERN: aligned tradeoff matrix | shared constraints decide. */
    .comparison-wrap { overflow-x: auto; }
    .comparison { width: 100%; min-width: 800px; border-collapse: collapse; text-align: left; }
    .comparison th,.comparison td { padding: 15px 18px; border-bottom: 1px solid var(--color-rule); vertical-align: top; }
    .comparison th { color: var(--color-soft); font-size: .76rem; font-weight: 600; }
    .comparison td { color: var(--color-muted); font-size: .86rem; }
    .comparison th:first-child,.comparison td:first-child { padding-left: 0; color: var(--color-ink); font-weight: 600; }
    .comparison .chosen { color: var(--color-accent); }

    /* PATTERN: implementation annex | shown as a full chapter in this template reference. */
    .annex-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 64px; }
    .annex-grid h3 { margin-bottom: 14px; font-size: .95rem; }
    .footer { padding: 23px 0 42px 76px; color: var(--color-soft); border-top: 1px solid var(--color-rule); font: 500 .7rem/1.5 var(--font-mono); }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .side-nav { display: none; }
    }

    @media (max-width: 960px) {
      .change-layout { grid-template-columns: 1fr; gap: 46px; }
    }

    @media (max-width: 880px) {
      .page { width: min(100% - 28px,var(--page)); }
      .header { padding: 50px 0 42px; }
      .context-strip { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px 18px; }
      .chapter { grid-template-columns: 32px minmax(0,1fr); gap: 0 12px; padding: 58px 0 66px; }
      .chapter-no { grid-column: 1; }
      .chapter-head,.chapter-body { grid-column: 2; }
      .grid-7-5,.grid-6-6,.change-layout,.annex-grid { grid-template-columns: 1fr; }
      .grid-7-5,.grid-6-6,.change-layout { gap: 46px; }
      .footer { padding-left: 44px; }
    }

    @media (max-width: 520px) {
      .context-strip { grid-template-columns: 1fr; gap: 12px; }
      .transform { grid-template-columns: 1fr; }
      .transform-arrow { justify-self: center; transform: rotate(90deg); }
      .ui-shell { grid-template-columns: 1fr; }
      .ui-sidebar { border-right: 0; border-bottom: 1px solid var(--color-rule); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content">
      <header class="header">
        <h1><!-- 替换为读者要理解的主题 --></h1>
        <p class="lede"><!-- 用一句完整的话给出当前结论，并交代理解所需的范围。 --></p>
      </header>
      <main>
        <section class="chapter" id="main-relation">
          <div class="chapter-body">
            <!-- 用当前事实构建主关系；按已选原语填写 SVG、表格或结构文本。 -->
            <!-- 原因、条件和证据贴在对应关系旁；交付前删除这些占位注释。 -->
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.12.0/build/highlight.min.js"></script>
  <script>
    function applyCodeFocus(code) {
      const terms = (code.dataset.focus || '').split('|').map(term => term.trim()).filter(Boolean);
      for (const term of terms) {
        const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) {
          if (!walker.currentNode.parentElement.closest('.code-focus')) nodes.push(walker.currentNode);
        }
        for (const node of nodes) {
          const value = node.nodeValue;
          if (!value.includes(term)) continue;
          const fragment = document.createDocumentFragment();
          let cursor = 0;
          let index = value.indexOf(term, cursor);
          while (index !== -1) {
            fragment.append(value.slice(cursor, index));
            const focus = document.createElement('span');
            focus.className = 'code-focus';
            focus.textContent = term;
            fragment.append(focus);
            cursor = index + term.length;
            index = value.indexOf(term, cursor);
          }
          fragment.append(value.slice(cursor));
          node.replaceWith(fragment);
        }
      }
    }

    if (window.hljs) {
      document.querySelectorAll('code[class*="language-"]').forEach(code => {
        window.hljs.highlightElement(code);
        applyCodeFocus(code);
      });
    }
  </script>
</body>
</html>
