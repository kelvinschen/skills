<svg class="diagram-canvas" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
  <title id="er-title">Commerce order domain model</title>
  <desc id="er-desc">An entity relationship model where one customer places many orders, one order contains many order items, and one product appears in many order items.</desc>
  <defs>
    <pattern id="er-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
  <rect width="100%" height="100%" fill="url(#er-dots)" opacity="0.55"/>

  <!-- Entity-level relationships are drawn before entity boxes -->
  <line x1="240" y1="240" x2="360" y2="240" stroke="var(--color-muted, #374151)" stroke-width="1.1"/>
  <path d="M 600,300 H 692 Q 700,300 700,308 V 350 Q 700,358 708,358 H 760" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1"/>
  <line x1="860" y1="240" x2="860" y2="300" stroke="var(--color-muted, #374151)" stroke-width="1.1"/>

  <!-- Cardinality and relationship labels -->
  <g class="mono" fill="var(--color-muted, #374151)" font-size="10" font-weight="600" text-anchor="middle">
    <text x="257" y="232">1</text>
    <text x="343" y="232">N</text>
    <text x="619" y="292">1</text>
    <text x="743" y="350">N</text>
    <text x="852" y="261" text-anchor="end">1</text>
    <text x="852" y="289" text-anchor="end">N</text>
  </g>
  <g class="mono" fill="var(--color-soft, #57606a)" font-size="8" text-anchor="middle" letter-spacing="0.12em">
    <text x="300" y="228">PLACES</text>
    <text x="684" y="290">CONTAINS</text>
    <text x="868" y="274" text-anchor="start">USED BY</text>
  </g>

  <!-- Customer entity -->
  <g>
    <rect x="40" y="140" width="200" height="180" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <rect x="40" y="140" width="200" height="40" rx="6" fill="rgba(30,41,59,0.04)"/>
    <rect x="40" y="172" width="200" height="8" fill="rgba(30,41,59,0.04)"/>
    <line x1="40" y1="180" x2="240" y2="180" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="56" y="156" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.14em">ENTITY</text>
    <text x="56" y="173" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600">Customer</text>
    <g class="mono" font-size="10">
      <text x="56" y="202" fill="var(--color-ink, #1d2129)"># id</text><text x="224" y="202" fill="var(--color-soft, #57606a)" text-anchor="end">CustomerId</text>
      <text x="56" y="226" fill="var(--color-ink, #1d2129)">email</text><text x="224" y="226" fill="var(--color-soft, #57606a)" text-anchor="end">Email</text>
      <text x="56" y="250" fill="var(--color-ink, #1d2129)">name</text><text x="224" y="250" fill="var(--color-soft, #57606a)" text-anchor="end">Text</text>
      <text x="56" y="274" fill="var(--color-ink, #1d2129)">status</text><text x="224" y="274" fill="var(--color-soft, #57606a)" text-anchor="end">CustomerStatus</text>
      <text x="56" y="298" fill="var(--color-ink, #1d2129)">joinedAt</text><text x="224" y="298" fill="var(--color-soft, #57606a)" text-anchor="end">Instant</text>
    </g>
  </g>

  <!-- Order aggregate root -->
  <g>
    <rect x="360" y="110" width="240" height="240" rx="6" fill="var(--color-accent-tint, rgba(217,83,30,0.09))" stroke="var(--color-accent, #d9531e)"/>
    <rect x="360" y="110" width="240" height="40" rx="6" fill="var(--color-accent-tint, rgba(217,83,30,0.09))"/>
    <rect x="360" y="142" width="240" height="8" fill="var(--color-accent-tint, rgba(217,83,30,0.09))"/>
    <line x1="360" y1="150" x2="600" y2="150" stroke="var(--color-accent, #d9531e)" stroke-opacity="0.45"/>
    <text class="mono" x="376" y="126" fill="var(--color-accent, #d9531e)" font-size="8" letter-spacing="0.12em">ENTITY · AGGREGATE ROOT</text>
    <text x="376" y="143" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600">Order</text>
    <g class="mono" font-size="10">
      <text x="376" y="174" fill="var(--color-ink, #1d2129)"># id</text><text x="584" y="174" fill="var(--color-soft, #57606a)" text-anchor="end">OrderId</text>
      <text x="376" y="198" fill="var(--color-ink, #1d2129)">→ customerId</text><text x="584" y="198" fill="var(--color-soft, #57606a)" text-anchor="end">CustomerId</text>
      <text x="376" y="222" fill="var(--color-ink, #1d2129)">number</text><text x="584" y="222" fill="var(--color-soft, #57606a)" text-anchor="end">OrderNumber</text>
      <text x="376" y="246" fill="var(--color-ink, #1d2129)">status</text><text x="584" y="246" fill="var(--color-soft, #57606a)" text-anchor="end">OrderStatus</text>
      <text x="376" y="270" fill="var(--color-ink, #1d2129)">total</text><text x="584" y="270" fill="var(--color-soft, #57606a)" text-anchor="end">Money</text>
      <text x="376" y="294" fill="var(--color-ink, #1d2129)">placedAt</text><text x="584" y="294" fill="var(--color-soft, #57606a)" text-anchor="end">Instant</text>
      <text x="376" y="318" fill="var(--color-ink, #1d2129)">shipping</text><text x="584" y="318" fill="var(--color-soft, #57606a)" text-anchor="end">Address</text>
    </g>
  </g>

  <!-- Product entity -->
  <g>
    <rect x="760" y="80" width="200" height="160" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <rect x="760" y="80" width="200" height="40" rx="6" fill="rgba(30,41,59,0.04)"/>
    <rect x="760" y="112" width="200" height="8" fill="rgba(30,41,59,0.04)"/>
    <line x1="760" y1="120" x2="960" y2="120" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="776" y="96" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.14em">ENTITY</text>
    <text x="776" y="113" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600">Product</text>
    <g class="mono" font-size="10">
      <text x="776" y="144" fill="var(--color-ink, #1d2129)"># id</text><text x="944" y="144" fill="var(--color-soft, #57606a)" text-anchor="end">ProductId</text>
      <text x="776" y="168" fill="var(--color-ink, #1d2129)">sku</text><text x="944" y="168" fill="var(--color-soft, #57606a)" text-anchor="end">Sku</text>
      <text x="776" y="192" fill="var(--color-ink, #1d2129)">name</text><text x="944" y="192" fill="var(--color-soft, #57606a)" text-anchor="end">Text</text>
      <text x="776" y="216" fill="var(--color-ink, #1d2129)">price</text><text x="944" y="216" fill="var(--color-soft, #57606a)" text-anchor="end">Money</text>
    </g>
  </g>

  <!-- Explicit association entity for the many-to-many relation -->
  <g>
    <rect x="760" y="300" width="200" height="140" rx="6" fill="rgba(30,41,59,0.04)" stroke="var(--color-muted, #374151)" stroke-dasharray="4,3"/>
    <rect x="760" y="300" width="200" height="40" rx="6" fill="rgba(30,41,59,0.06)"/>
    <rect x="760" y="332" width="200" height="8" fill="rgba(30,41,59,0.06)"/>
    <line x1="760" y1="340" x2="960" y2="340" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="776" y="316" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.12em">ASSOCIATION</text>
    <text x="776" y="333" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600">OrderItem</text>
    <g class="mono" font-size="10">
      <text x="776" y="364" fill="var(--color-ink, #1d2129)">→ orderId</text><text x="944" y="364" fill="var(--color-soft, #57606a)" text-anchor="end">OrderId</text>
      <text x="776" y="388" fill="var(--color-ink, #1d2129)">→ productId</text><text x="944" y="388" fill="var(--color-soft, #57606a)" text-anchor="end">ProductId</text>
      <text x="776" y="412" fill="var(--color-ink, #1d2129)">quantity</text><text x="944" y="412" fill="var(--color-soft, #57606a)" text-anchor="end">PositiveInt</text>
      <text x="776" y="432" fill="var(--color-ink, #1d2129)">unitPrice</text><text x="944" y="432" fill="var(--color-soft, #57606a)" text-anchor="end">Money</text>
    </g>
  </g>

  <!-- Legend -->
  <line x1="40" y1="468" x2="960" y2="468" stroke="var(--color-rule, rgba(30,41,59,0.14))"/>
  <rect x="40" y="486" width="14" height="10" rx="2" fill="var(--color-accent-tint, rgba(217,83,30,0.09))" stroke="var(--color-accent, #d9531e)"/>
  <text x="64" y="495" fill="var(--color-soft, #57606a)" font-size="8.5">aggregate root</text>
  <rect x="184" y="486" width="14" height="10" rx="2" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
  <text x="208" y="495" fill="var(--color-soft, #57606a)" font-size="8.5">entity</text>
  <rect x="286" y="486" width="14" height="10" rx="2" fill="rgba(30,41,59,0.04)" stroke="var(--color-muted, #374151)" stroke-dasharray="3,2"/>
  <text x="310" y="495" fill="var(--color-soft, #57606a)" font-size="8.5">association entity</text>
  <text class="mono" x="470" y="495" fill="var(--color-ink, #1d2129)" font-size="10" font-weight="600">#</text>
  <text x="486" y="495" fill="var(--color-soft, #57606a)" font-size="8.5">identity</text>
  <text class="mono" x="566" y="495" fill="var(--color-ink, #1d2129)" font-size="10" font-weight="600">→</text>
  <text x="582" y="495" fill="var(--color-soft, #57606a)" font-size="8.5">entity reference</text>
  <text class="mono" x="720" y="495" fill="var(--color-muted, #374151)" font-size="10" font-weight="600">1 / N</text>
  <text x="760" y="495" fill="var(--color-soft, #57606a)" font-size="8.5">cardinality</text>
</svg>
