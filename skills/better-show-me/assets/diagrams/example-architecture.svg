<svg class="diagram-canvas" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Content site in production</title>
  <desc id="architecture-desc">Architecture diagram showing reader requests moving through Cloudflare to an Astro origin, MDX bundle, and content CMS.</desc>
    <defs>
      <pattern id="arch-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
      </pattern>
      <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/></marker>
      <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/></marker>
      <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-link, #275296)"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
    <rect width="100%" height="100%" fill="url(#arch-dots)" opacity="0.55"/>

    <!-- Zone: Content services (drawn before arrows and nodes) -->
    <rect x="616" y="128" width="164" height="272" rx="8"
          fill="rgba(30,41,59,0.02)" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
    <text x="628" y="146" fill="rgba(30,41,59,0.40)" font-size="7"
          letter-spacing="0.14em">CONTENT</text>

    <!-- Arrows first (behind boxes) -->
    <line x1="168" y1="272" x2="220" y2="272" stroke="var(--color-link, #275296)" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
    <line x1="364" y1="272" x2="416" y2="272" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
    <!-- Exit Astro top→enter MDX bottom; exit Astro bottom→enter CMS top -->
    <path d="M 496,240 H 692 Q 700,240 700,232 V 224"
          fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <path d="M 496,304 H 692 Q 700,304 700,312 V 320"
          fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

    <!-- Dashed return: Cloudflare→Reader (cached HTML — same orthogonal rules as solid) -->
    <path d="M 220,288 H 168" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>

    <!-- Arrow labels -->
    <text x="196" y="262" fill="var(--color-link, #275296)" font-size="8" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

    <text x="188" y="301" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">RESP</text>

    <text x="392" y="262" fill="var(--color-accent, #d9531e)" font-size="8" text-anchor="middle" letter-spacing="0.08em">SSR</text>

    <text x="662" y="255" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

    <text x="654" y="295" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

    <!-- Node: Reader -->
    <rect x="40" y="240" width="128" height="64" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(55,65,81,0.10)" stroke="var(--color-soft, #57606a)" stroke-width="1"/>
    <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(87,96,106,0.40)" stroke-width="0.8"/>
    <text x="62" y="257" fill="var(--color-soft, #57606a)" font-size="7" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="104" y="276" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Reader</text>
    <text x="104" y="292" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">Browser</text>

    <!-- Node: Cloudflare -->
    <rect x="220" y="240" width="144" height="64" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="220" y="240" width="144" height="64" rx="6" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <rect x="228" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.22)" stroke-width="0.8"/>
    <text x="244" y="257" fill="var(--color-soft, #57606a)" font-size="7" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
    <text x="356" y="300" fill="rgba(30,41,59,0.06)" font-size="32" font-weight="600" text-anchor="end">01</text>
    <text x="292" y="276" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Cloudflare</text>
    <text x="292" y="292" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">Pages · cache</text>

    <!-- Node: Astro (focal coral) -->
    <rect x="416" y="240" width="160" height="64" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="416" y="240" width="160" height="64" rx="6" fill="var(--color-accent-tint, rgba(217,83,30,0.08))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
    <rect x="424" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(217,83,30,0.50)" stroke-width="0.8"/>
    <text x="440" y="257" fill="var(--color-accent, #d9531e)" font-size="7" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
    <text x="568" y="300" fill="rgba(217,83,30,0.10)" font-size="32" font-weight="600" text-anchor="end">02</text>
    <text x="496" y="276" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Astro Origin</text>
    <text x="496" y="292" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">SSR + MDX</text>

    <!-- Node: MDX Bundle -->
    <rect x="628" y="160" width="144" height="64" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="628" y="160" width="144" height="64" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <rect x="636" y="168" width="32" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.40)" stroke-width="0.8"/>
    <text x="652" y="177" fill="var(--color-ink, #1d2129)" font-size="7" text-anchor="middle" letter-spacing="0.08em">BUN</text>
    <text x="700" y="196" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">MDX Bundle</text>
    <text x="700" y="212" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">src/content/*.mdx</text>

    <!-- Node: Content CMS -->
    <rect x="628" y="320" width="144" height="64" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="628" y="320" width="144" height="64" rx="6" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="1"/>
    <rect x="636" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(55,65,81,0.50)" stroke-width="0.8"/>
    <text x="650" y="337" fill="var(--color-muted, #374151)" font-size="7" text-anchor="middle" letter-spacing="0.08em">CMS</text>
    <text x="700" y="356" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Content CMS</text>
    <text x="700" y="372" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">assets · og images</text>

    <!-- Legend strip -->
    <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
    <text x="40" y="420" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="436" width="14" height="10" rx="2" fill="var(--color-accent-tint, rgba(217,83,30,0.08))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
    <text x="60" y="444" fill="var(--color-muted, #374151)" font-size="8.5">Focal / origin</text>

    <rect x="180" y="436" width="14" height="10" rx="2" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <text x="200" y="444" fill="var(--color-muted, #374151)" font-size="8.5">Backend / bundle</text>

    <rect x="340" y="436" width="14" height="10" rx="2" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="1"/>
    <text x="360" y="444" fill="var(--color-muted, #374151)" font-size="8.5">Store</text>

    <rect x="436" y="436" width="14" height="10" rx="2" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <text x="456" y="444" fill="var(--color-muted, #374151)" font-size="8.5">Cloud</text>

    <rect x="528" y="436" width="14" height="10" rx="2" fill="rgba(55,65,81,0.10)" stroke="var(--color-soft, #57606a)" stroke-width="1"/>
    <text x="548" y="444" fill="var(--color-muted, #374151)" font-size="8.5">External</text>

    <line x1="636" y1="442" x2="664" y2="442" stroke="var(--color-link, #275296)" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
    <text x="672" y="444" fill="var(--color-muted, #374151)" font-size="8.5">HTTP request</text>

    <line x1="784" y1="442" x2="812" y2="442" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
    <text x="820" y="444" fill="var(--color-muted, #374151)" font-size="8.5">Primary flow</text>

    <line x1="900" y1="442" x2="928" y2="442" stroke="var(--color-muted, #374151)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
    <text x="936" y="444" fill="var(--color-muted, #374151)" font-size="8.5">Return / async</text>
  </svg>
