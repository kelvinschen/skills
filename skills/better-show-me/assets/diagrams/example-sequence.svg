<svg class="diagram-canvas" viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-title sequence-desc">
  <title id="sequence-title">Article request, cold cache</title>
  <desc id="sequence-desc">Sequence diagram showing a cold-cache article request moving from reader and browser through Cloudflare to an Astro origin and analytics beacon.</desc>
    <defs>
      <!-- Dot grid background -->
      <pattern id="seq-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
      </pattern>

      <!-- Arrow markers -->
      <marker id="seq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/>
      </marker>
      <marker id="seq-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M 0 0 L 7 3 L 0 6" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1"/>
      </marker>
      <marker id="seq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/>
      </marker>
      <marker id="seq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="var(--color-link, #275296)"/>
      </marker>
    </defs>

    <!-- Background: paper + dot grid -->
    <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
    <rect width="100%" height="100%" fill="url(#seq-dots)" opacity="0.55"/>

    <!-- =================================================================
         LIFELINES — dashed vertical lines from each actor, behind everything.
         Actor lifeline x-coords: 128, 352, 584, 800
         ================================================================= -->
    <line x1="128" y1="128" x2="128" y2="488" stroke="rgba(30,41,59,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="352" y1="128" x2="352" y2="488" stroke="rgba(30,41,59,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="584" y1="128" x2="584" y2="488" stroke="rgba(30,41,59,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="128" x2="800" y2="488" stroke="rgba(30,41,59,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- =================================================================
         ACTIVATION BARS — w=8 rects on lifelines showing control duration.
         Drawn before message arrows so arrows land on their edges.
         ================================================================= -->
    <!-- Cloudflare activation: receives at y=176, responds at y=408 -->
    <rect x="348" y="180" width="8" height="232" fill="rgba(30,41,59,0.06)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <!-- Astro activation: called at y=232, returns at y=352 -->
    <rect x="580" y="236" width="8" height="120" fill="rgba(30,41,59,0.06)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>

    <!-- =================================================================
         MESSAGE ARROWS
         ================================================================= -->

    <!-- M1: Reader → Cloudflare  (HTTPS request · link-blue) -->
    <line data-message-role="sync" x1="128" y1="176" x2="352" y2="176" stroke="var(--color-link, #275296)" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>

    <!-- M2: Cloudflare → Astro  (cache miss · muted) -->
    <line data-message-role="sync" x1="352" y1="232" x2="580" y2="232" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#seq-arrow)"/>

    <!-- M3: Astro self-message  (render MDX · muted U-loop) -->
    <path data-message-role="self" d="M 588 284 L 624 284 L 624 316 L 588 316" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#seq-arrow)"/>

    <!-- M4: Astro → Cloudflare  (return HTML · muted dashed) -->
    <line data-message-role="return" x1="580" y1="352" x2="356" y2="352" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow)"/>

    <!-- M5: Cloudflare → Reader  (primary success return · coral dashed) -->
    <line data-message-role="return" x1="348" y1="408" x2="128" y2="408" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#seq-arrow-accent)"/>

    <!-- M6: Reader → Analytics  (async beacon · muted dashed) -->
    <line data-message-role="async" x1="128" y1="464" x2="800" y2="464" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow-open)"/>

    <!-- =================================================================
         MESSAGE LABELS — placed cleanly 4~6px above arrow lines
         ================================================================= -->

    <!-- M1 label -->
    <text x="240" y="169" fill="var(--color-link, #275296)" font-size="8" text-anchor="middle" letter-spacing="0.08em">GET /ARTICLES/SLUG</text>

    <!-- M2 label -->
    <text x="466" y="225" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">CACHE MISS · ORIGIN</text>

    <!-- M3 label (to the right of the self-loop) -->
    <text x="668" y="300" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">RENDER MDX</text>

    <!-- M4 label -->
    <text x="468" y="345" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">200 · HTML + MAX-AGE</text>

    <!-- M5 label (coral · primary response) -->
    <text x="240" y="401" fill="var(--color-accent, #d9531e)" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">200 · EDGE-CACHED</text>

    <!-- M6 label (placed between Astro and Analytics lifelines, a clear gap) -->
    <text x="696" y="457" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">PAGEVIEW BEACON</text>

    <!-- =================================================================
         ACTOR BOXES — drawn after arrows/labels.
         Each actor: 144–160 wide × 56 tall. Centers: 128, 352, 584, 800.
         ================================================================= -->

    <!-- Actor 1: Reader (external / soft) -->
    <rect x="56" y="72" width="144" height="56" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(55,65,81,0.10)" stroke="var(--color-soft, #57606a)" stroke-width="1"/>
    <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(87,96,106,0.40)" stroke-width="0.8"/>
    <text x="78" y="89" fill="var(--color-soft, #57606a)" font-size="7" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="128" y="104" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Reader</text>
    <text x="128" y="119" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">Browser</text>

    <!-- Actor 2: Cloudflare (cloud / muted) -->
    <rect x="280" y="72" width="144" height="56" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="280" y="72" width="144" height="56" rx="6" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <rect x="288" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.22)" stroke-width="0.8"/>
    <text x="304" y="89" fill="var(--color-soft, #57606a)" font-size="7" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
    <text x="352" y="104" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Cloudflare</text>
    <text x="352" y="119" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">Pages · cache</text>

    <!-- Actor 3: Astro Origin (focal / coral) -->
    <rect x="504" y="72" width="160" height="56" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="504" y="72" width="160" height="56" rx="6" fill="var(--color-accent-tint, rgba(217,83,30,0.08))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
    <rect x="512" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(217,83,30,0.50)" stroke-width="0.8"/>
    <text x="528" y="89" fill="var(--color-accent, #d9531e)" font-size="7" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
    <text x="584" y="104" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Astro Origin</text>
    <text x="584" y="119" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">SSR + MDX</text>

    <!-- Actor 4: Analytics (optional / dashed) -->
    <rect x="728" y="72" width="144" height="56" rx="6" fill="var(--color-paper, #f4f5f7)"/>
    <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(30,41,59,0.02)" stroke="rgba(30,41,59,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="736" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.22)" stroke-width="0.8"/>
    <text x="750" y="89" fill="var(--color-soft, #57606a)" font-size="7" text-anchor="middle" letter-spacing="0.08em">ASY</text>
    <text x="800" y="104" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Analytics</text>
    <text x="800" y="119" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">Beacon · async</text>

    <!-- =================================================================
         LEGEND — horizontal strip at the bottom.
         Separator at y=504, eyebrow at y=520, items at y=540–548.
         ================================================================= -->
    <line x1="56" y1="504" x2="944" y2="504" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
    <text x="56" y="520" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">LEGEND</text>

    <!-- Item 1: Actor swatch (coral focal) -->
    <rect x="56" y="540" width="14" height="10" rx="2" fill="var(--color-accent-tint, rgba(217,83,30,0.08))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
    <text x="76" y="548" fill="var(--color-muted, #374151)" font-size="8.5">Focal actor</text>

    <!-- Item 2: Activation bar swatch -->
    <rect x="188" y="536" width="4" height="18" fill="rgba(30,41,59,0.06)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="200" y="548" fill="var(--color-muted, #374151)" font-size="8.5">Activation</text>

    <!-- Item 3: Request arrow (link-blue) -->
    <line x1="308" y1="546" x2="336" y2="546" stroke="var(--color-link, #275296)" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>
    <text x="344" y="548" fill="var(--color-muted, #374151)" font-size="8.5">HTTP request</text>

    <!-- Item 4: Return (muted dashed, filled arrowhead) -->
    <line x1="476" y1="546" x2="504" y2="546" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow)"/>
    <text x="512" y="548" fill="var(--color-muted, #374151)" font-size="8.5">Return</text>

    <!-- Item 5: Primary response (coral) -->
    <line x1="652" y1="546" x2="680" y2="546" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#seq-arrow-accent)"/>
    <text x="688" y="548" fill="var(--color-muted, #374151)" font-size="8.5">Primary response</text>

    <!-- Item 6: Async (muted dashed, open arrowhead) -->
    <line x1="790" y1="546" x2="818" y2="546" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow-open)"/>
    <text x="826" y="548" fill="var(--color-muted, #374151)" font-size="8.5">Async</text>

  </svg>
