<svg class="diagram-canvas" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dependency-title dependency-desc">
  <title id="dependency-title">TypeScript workspace dependency graph</title>
  <desc id="dependency-desc">A ranked dependency graph where two applications converge on shared packages, shared-types has three incoming dependencies, and logger creates one highlighted cycle back to shared-types.</desc>
  <defs>
    <pattern id="dep-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
    </pattern>
    <marker id="dep-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/>
    </marker>
    <marker id="dep-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
  <rect width="100%" height="100%" fill="url(#dep-dots)" opacity="0.55"/>

  <!-- Rank labels -->
  <g class="mono" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.18em">
    <text x="40" y="92">RANK 0 · APPS</text>
    <text x="40" y="212">RANK 1 · PACKAGES</text>
    <text x="40" y="332">RANK 2 · SHARED</text>
    <text x="40" y="452">RANK 3 · LEAVES</text>
  </g>

  <!-- Forward dependencies, drawn before nodes -->
  <line x1="310" y1="116" x2="310" y2="180" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <line x1="690" y1="116" x2="690" y2="180" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <path d="M 282,236 V 268 Q 282,276 290,276 H 402 Q 410,276 410,284 V 300" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <path d="M 662,236 V 260 Q 662,268 654,268 H 458 Q 450,268 450,276 V 300" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <path d="M 338,236 V 252 Q 338,260 346,260 H 642 Q 650,260 650,268 V 300" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <path d="M 410,356 V 388 Q 410,396 418,396 H 492 Q 500,396 500,404 V 420" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <path d="M 650,356 V 388 Q 650,396 642,396 H 548 Q 540,396 540,404 V 420" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>
  <path d="M 450,356 V 372 Q 450,380 458,380 H 762 Q 770,380 770,388 V 420" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.1" marker-end="url(#dep-arrow)"/>

  <!-- The one editorial cycle, routed outside the rank stack -->
  <path d="M 450,448 H 188 Q 180,448 180,440 V 336 Q 180,328 188,328 H 330" fill="none" stroke="var(--color-accent, #d9531e)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#dep-arrow-accent)"/>
  <text class="mono" x="228" y="316" fill="var(--color-accent, #d9531e)" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.12em">CYCLE</text>

  <!-- Rank 0 -->
  <g>
    <rect x="230" y="60" width="160" height="56" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="246" y="86" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">web-app</text>
    <text class="mono" x="246" y="103" fill="var(--color-soft, #57606a)" font-size="9">apps/web</text>
    <rect x="350" y="68" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="366" y="78" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">0 in</text>

    <rect x="610" y="60" width="160" height="56" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="626" y="86" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">admin-app</text>
    <text class="mono" x="626" y="103" fill="var(--color-soft, #57606a)" font-size="9">apps/admin</text>
    <rect x="730" y="68" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="746" y="78" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">0 in</text>
  </g>

  <!-- Rank 1 -->
  <g>
    <rect x="230" y="180" width="160" height="56" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="246" y="206" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">api-client</text>
    <text class="mono" x="246" y="223" fill="var(--color-soft, #57606a)" font-size="9">packages/api</text>
    <rect x="350" y="188" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="366" y="198" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">1 in</text>

    <rect x="610" y="180" width="160" height="56" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="626" y="206" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">ui-kit</text>
    <text class="mono" x="626" y="223" fill="var(--color-soft, #57606a)" font-size="9">packages/ui</text>
    <rect x="730" y="188" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="746" y="198" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">1 in</text>
  </g>

  <!-- Rank 2: shared-types is the highest fan-in node -->
  <g>
    <rect x="330" y="300" width="160" height="56" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="346" y="326" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">shared-types</text>
    <text class="mono" x="346" y="343" fill="var(--color-soft, #57606a)" font-size="9">packages/types</text>
    <rect x="450" y="308" width="32" height="14" rx="2" fill="rgba(55,65,81,0.08)" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="466" y="318" fill="var(--color-ink, #1d2129)" font-size="8" font-weight="600" text-anchor="middle">3 in</text>

    <rect x="570" y="300" width="160" height="56" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="586" y="326" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">telemetry</text>
    <text class="mono" x="586" y="343" fill="var(--color-soft, #57606a)" font-size="9">packages/otel</text>
    <rect x="690" y="308" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="706" y="318" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">1 in</text>
  </g>

  <!-- Rank 3 -->
  <g>
    <rect x="450" y="420" width="160" height="56" rx="6" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)"/>
    <text x="466" y="446" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">logger</text>
    <text class="mono" x="466" y="463" fill="var(--color-soft, #57606a)" font-size="9">packages/log</text>
    <rect x="570" y="428" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="586" y="438" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">2 in</text>

    <rect x="690" y="420" width="160" height="56" rx="6" fill="rgba(30,41,59,0.03)" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text x="706" y="446" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600">zod</text>
    <text class="mono" x="706" y="463" fill="var(--color-soft, #57606a)" font-size="9">v3.23 · npm</text>
    <rect x="810" y="428" width="32" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="826" y="438" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">1 in</text>
  </g>

  <line x1="40" y1="510" x2="960" y2="510" stroke="var(--color-rule, rgba(30,41,59,0.14))"/>
  <text class="mono" x="40" y="530" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.16em">DEPENDENT → DEPENDENCY · BADGE = FAN-IN</text>
  <line x1="520" y1="526" x2="552" y2="526" stroke="var(--color-accent, #d9531e)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#dep-arrow-accent)"/>
  <text x="562" y="530" fill="var(--color-soft, #57606a)" font-size="8.5">one highlighted cycle</text>
</svg>
