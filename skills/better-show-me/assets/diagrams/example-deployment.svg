<svg class="diagram-canvas" viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc">
  <title id="deployment-title">Checkout service production deployment</title>
  <desc id="deployment-desc">A production deployment across edge, application, and data zones, showing versioned artifacts, three application replicas, protocol and port labels, and PostgreSQL primary-to-standby replication.</desc>
  <defs>
    <pattern id="deploy-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
    </pattern>
    <marker id="deploy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/>
    </marker>
    <marker id="deploy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-link, #275296)"/>
    </marker>
    <marker id="deploy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
  <rect width="100%" height="100%" fill="url(#deploy-dots)" opacity="0.55"/>

  <!-- Real environment and network boundaries -->
  <g fill="rgba(30,41,59,0.02)" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))" stroke-dasharray="4,4">
    <rect x="40" y="48" width="220" height="276" rx="8"/>
    <rect x="300" y="48" width="320" height="276" rx="8"/>
    <rect x="660" y="48" width="340" height="276" rx="8"/>
  </g>
  <g class="mono" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.16em">
    <text x="56" y="68">EDGE · GLOBAL</text>
    <text x="316" y="68">PROD · EU-WEST-1 · APP</text>
    <text x="676" y="68">PROD · EU-WEST-1 · DATA</text>
  </g>

  <!-- Network paths before labels and nodes -->
  <path d="M 230,162 H 272 Q 280,162 280,154 V 122 Q 280,114 288,114 H 330" fill="none" stroke="var(--color-link, #275296)" stroke-width="1.3" marker-end="url(#deploy-arrow-link)"/>
  <line x1="460" y1="164" x2="460" y2="200" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#deploy-arrow)"/>
  <path d="M 590,254 H 642 Q 650,254 650,246 V 122 Q 650,114 658,114 H 700" fill="none" stroke="var(--color-link, #275296)" stroke-width="1.3" marker-end="url(#deploy-arrow-link)"/>
  <line x1="830" y1="164" x2="830" y2="210" stroke="var(--color-accent, #d9531e)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#deploy-arrow-accent)"/>

  <!-- Protocol and port labels -->
  <g class="mono" font-size="8" letter-spacing="0.08em" text-anchor="middle">
    <text x="272" y="150" fill="var(--color-link, #275296)" text-anchor="end">HTTPS:443</text>
    <text x="452" y="184" fill="var(--color-muted, #374151)" text-anchor="end">HTTP:8080</text>
    <text x="658" y="184" fill="var(--color-link, #275296)" text-anchor="start">TLS:5432</text>
    <text x="842" y="188" fill="var(--color-accent, #d9531e)" text-anchor="start">ASYNC WAL</text>
  </g>

  <!-- Edge node -->
  <g>
    <rect x="70" y="120" width="160" height="84" rx="6" fill="rgba(30,41,59,0.03)" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <rect x="78" y="128" width="32" height="12" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="94" y="137" fill="var(--color-soft, #57606a)" font-size="7" text-anchor="middle" letter-spacing="0.08em">CDN</text>
    <text x="150" y="158" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">global-edge</text>
    <rect x="78" y="168" width="144" height="24" rx="4" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="86" y="184" fill="var(--color-ink, #1d2129)" font-size="11">edge-rules</text>
    <text class="mono" x="214" y="184" fill="var(--color-soft, #57606a)" font-size="9" text-anchor="end">v18</text>
  </g>

  <!-- Application-zone infrastructure nodes -->
  <g>
    <rect x="330" y="80" width="260" height="84" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <rect x="338" y="88" width="32" height="12" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="354" y="97" fill="var(--color-muted, #374151)" font-size="7" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <rect x="550" y="88" width="32" height="12" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="566" y="97" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">x2</text>
    <text x="460" y="118" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">ingress</text>
    <rect x="338" y="132" width="244" height="24" rx="4" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="346" y="148" fill="var(--color-ink, #1d2129)" font-size="11">nginx-ingress</text>
    <text class="mono" x="574" y="148" fill="var(--color-soft, #57606a)" font-size="9" text-anchor="end">v1.11.1</text>

    <rect x="330" y="200" width="260" height="108" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <rect x="338" y="208" width="32" height="12" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="354" y="217" fill="var(--color-muted, #374151)" font-size="7" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <rect x="550" y="208" width="32" height="12" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="566" y="217" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">x3</text>
    <text x="460" y="238" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">checkout-app</text>
    <rect x="338" y="248" width="244" height="24" rx="4" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="346" y="264" fill="var(--color-ink, #1d2129)" font-size="11">checkout-api</text>
    <text class="mono" x="574" y="264" fill="var(--color-soft, #57606a)" font-size="9" text-anchor="end">v2.4.1</text>
    <rect x="338" y="280" width="244" height="20" rx="4" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="346" y="294" fill="var(--color-ink, #1d2129)" font-size="10">otel-sidecar</text>
    <text class="mono" x="574" y="294" fill="var(--color-soft, #57606a)" font-size="9" text-anchor="end">v0.9.0</text>
  </g>

  <!-- Data-zone managed nodes -->
  <g>
    <rect x="700" y="80" width="260" height="84" rx="6" fill="var(--color-accent-tint, rgba(217,83,30,0.09))" stroke="var(--color-accent, #d9531e)"/>
    <rect x="708" y="88" width="64" height="12" rx="2" fill="none" stroke="var(--color-accent, #d9531e)" stroke-opacity="0.5"/>
    <text class="mono" x="740" y="97" fill="var(--color-accent, #d9531e)" font-size="7" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
    <text x="830" y="118" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">orders-primary</text>
    <rect x="708" y="132" width="244" height="24" rx="4" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="716" y="148" fill="var(--color-ink, #1d2129)" font-size="11">postgres</text>
    <text class="mono" x="944" y="148" fill="var(--color-soft, #57606a)" font-size="9" text-anchor="end">16.2</text>

    <rect x="700" y="210" width="260" height="84" rx="6" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)"/>
    <rect x="708" y="218" width="64" height="12" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
    <text class="mono" x="740" y="227" fill="var(--color-muted, #374151)" font-size="7" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
    <text x="830" y="248" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">orders-standby</text>
    <rect x="708" y="262" width="244" height="24" rx="4" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="0.8"/>
    <text x="716" y="278" fill="var(--color-ink, #1d2129)" font-size="11">postgres</text>
    <text class="mono" x="944" y="278" fill="var(--color-soft, #57606a)" font-size="9" text-anchor="end">16.2</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="352" x2="1000" y2="352" stroke="var(--color-rule, rgba(30,41,59,0.14))"/>
  <text class="mono" x="40" y="372" fill="var(--color-soft, #57606a)" font-size="8" letter-spacing="0.16em">ZONE → INFRA NODE → VERSIONED ARTIFACT</text>
  <line x1="390" y1="368" x2="422" y2="368" stroke="var(--color-link, #275296)" stroke-width="1.3" marker-end="url(#deploy-arrow-link)"/>
  <text x="432" y="372" fill="var(--color-soft, #57606a)" font-size="8.5">cross-zone</text>
  <line x1="540" y1="368" x2="572" y2="368" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#deploy-arrow)"/>
  <text x="582" y="372" fill="var(--color-soft, #57606a)" font-size="8.5">in-zone</text>
  <line x1="680" y1="368" x2="712" y2="368" stroke="var(--color-accent, #d9531e)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#deploy-arrow-accent)"/>
  <text x="722" y="372" fill="var(--color-soft, #57606a)" font-size="8.5">replication</text>
  <rect x="40" y="400" width="14" height="10" rx="2" fill="var(--color-accent-tint, rgba(217,83,30,0.09))" stroke="var(--color-accent, #d9531e)"/>
  <text x="64" y="409" fill="var(--color-soft, #57606a)" font-size="8.5">focal / primary</text>
  <rect x="190" y="400" width="14" height="10" rx="2" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
  <text x="214" y="409" fill="var(--color-soft, #57606a)" font-size="8.5">infrastructure node</text>
  <rect x="370" y="398" width="42" height="14" rx="2" fill="none" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
  <text class="mono" x="391" y="408" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle">xN</text>
  <text x="422" y="409" fill="var(--color-soft, #57606a)" font-size="8.5">replica count</text>
</svg>
