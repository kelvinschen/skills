<svg class="diagram-canvas" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swimlane-title swimlane-desc">
  <title id="swimlane-title">Publishing an article</title>
  <desc id="swimlane-desc">Swimlane diagram showing an article moving from author through reviewer and editor to CI/CD, with responsibility handoffs between each lane.</desc>
  <defs>
    <pattern id="swimlane-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
    </pattern>
    <marker id="swimlane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/>
    </marker>
    <marker id="swimlane-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
  <rect width="100%" height="100%" fill="url(#swimlane-dots)" opacity="0.55"/>

  <!-- Lanes and actor column -->
  <line x1="40" y1="72" x2="960" y2="72" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
  <line x1="40" y1="152" x2="960" y2="152" stroke="var(--color-rule, rgba(30,41,59,0.14))"/>
  <line x1="40" y1="232" x2="960" y2="232" stroke="var(--color-rule, rgba(30,41,59,0.14))"/>
  <line x1="40" y1="312" x2="960" y2="312" stroke="var(--color-rule, rgba(30,41,59,0.14))"/>
  <line x1="40" y1="392" x2="960" y2="392" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>
  <line x1="160" y1="72" x2="160" y2="392" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))"/>

  <g class="mono" fill="var(--color-muted, #374151)" font-size="9" letter-spacing="0.18em">
    <text x="60" y="116">AUTHOR</text>
    <text x="60" y="196">REVIEWER</text>
    <text x="60" y="276">EDITOR</text>
    <text x="60" y="356">CI / CD</text>
  </g>

  <!-- Process edges, drawn before steps -->
  <line x1="300" y1="112" x2="340" y2="112" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#swimlane-arrow)"/>
  <line x1="460" y1="136" x2="500" y2="168" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#swimlane-arrow)"/>
  <line x1="570" y1="216" x2="570" y2="248" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#swimlane-arrow)"/>
  <line x1="640" y1="272" x2="680" y2="272" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#swimlane-arrow)"/>
  <line x1="750" y1="296" x2="720" y2="328" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#swimlane-arrow-accent)"/>
  <line x1="760" y1="352" x2="800" y2="352" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#swimlane-arrow)"/>

  <g class="mono" font-size="8" text-anchor="middle" letter-spacing="0.12em">
    <text x="508" y="144" fill="var(--color-muted, #374151)" text-anchor="start">HANDOFF</text>
    <text x="578" y="224" fill="var(--color-muted, #374151)" text-anchor="start">REVISE</text>
    <text x="758" y="304" fill="var(--color-accent, #d9531e)" text-anchor="start">DEPLOY TRIGGER</text>
  </g>

  <!-- Steps -->
  <g text-anchor="middle">
    <rect x="180" y="88" width="120" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="240" y="110" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Draft article</text>
    <text class="mono" x="240" y="124" fill="var(--color-muted, #374151)" font-size="8">content/*.md</text>

    <rect x="340" y="88" width="120" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="400" y="110" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Open PR</text>
    <text class="mono" x="400" y="124" fill="var(--color-muted, #374151)" font-size="8">draft → review</text>

    <rect x="500" y="168" width="140" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="570" y="190" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Review facts</text>
    <text class="mono" x="570" y="204" fill="var(--color-muted, #374151)" font-size="8">sources · accuracy</text>

    <rect x="500" y="248" width="140" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="570" y="270" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Polish copy</text>
    <text class="mono" x="570" y="284" fill="var(--color-muted, #374151)" font-size="8">voice · line edits</text>

    <rect x="680" y="248" width="140" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="750" y="270" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Approve merge</text>
    <text class="mono" x="750" y="284" fill="var(--color-muted, #374151)" font-size="8">squash · main</text>

    <rect x="680" y="328" width="80" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)"/>
    <text x="720" y="350" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Build</text>
    <text class="mono" x="720" y="364" fill="var(--color-muted, #374151)" font-size="8">site build</text>

    <rect x="800" y="328" width="120" height="48" rx="6" fill="var(--color-accent-tint, rgba(217,83,30,0.09))" stroke="var(--color-accent, #d9531e)"/>
    <text x="860" y="350" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600">Deploy</text>
    <text class="mono" x="860" y="364" fill="var(--color-muted, #374151)" font-size="8">production</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="420" x2="960" y2="420" stroke="var(--color-rule, rgba(30,41,59,0.14))" stroke-width="0.8"/>
  <text class="mono" x="40" y="436" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">LEGEND</text>
  <line x1="40" y1="456" x2="68" y2="456" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#swimlane-arrow)"/>
  <text x="76" y="459" fill="var(--color-muted, #374151)" font-size="8.5">Within-lane step</text>
  <line x1="220" y1="456" x2="248" y2="456" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#swimlane-arrow-accent)"/>
  <text x="256" y="459" fill="var(--color-muted, #374151)" font-size="8.5">Critical handoff</text>
  <line x1="400" y1="456" x2="428" y2="456" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#swimlane-arrow)"/>
  <text x="436" y="459" fill="var(--color-muted, #374151)" font-size="8.5">Revision loop</text>
</svg>
