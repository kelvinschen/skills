<svg class="diagram-canvas" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
  <title id="flowchart-title">Should you write this as a skill?</title>
  <desc id="flowchart-desc">Flowchart showing when a new workflow should stay manual, become a project note, or be written as a reusable skill.</desc>
    <defs>
      <pattern id="flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
      </pattern>
      <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/></marker>
      <marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
    <rect width="100%" height="100%" fill="url(#flow-dots)" opacity="0.55"/>

    <!-- Arrows (drawn first, behind nodes) -->
    <!-- Start → Step -->
    <line x1="500" y1="88" x2="500" y2="120" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <!-- Step → Diamond 1 -->
    <line x1="500" y1="168" x2="500" y2="192" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <!-- Diamond 1 "NO" right -->
    <line x1="600" y1="240" x2="720" y2="240" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <!-- Diamond 1 "YES" down -->
    <line x1="500" y1="288" x2="500" y2="328" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <!-- Diamond 2 "NO" right -->
    <line x1="600" y1="376" x2="720" y2="376" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <!-- Diamond 2 "YES" down (coral — happy path) -->
    <line x1="500" y1="424" x2="500" y2="464" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#flow-arrow-accent)"/>

    <!-- Arrow labels -->
    <text x="656" y="232" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.12em">NO</text>

    <text x="508" y="310" fill="var(--color-muted, #374151)" font-size="8" text-anchor="start" letter-spacing="0.12em">YES</text>

    <text x="656" y="368" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.12em">NO</text>

    <text x="508" y="446" fill="var(--color-accent, #d9531e)" font-size="8" text-anchor="start" letter-spacing="0.12em">YES</text>

    <!-- Start oval -->
    <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <text x="500" y="68" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">New workflow</text>

    <!-- Rectangle: Step -->
    <rect x="420" y="120" width="160" height="48" rx="6" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <text x="500" y="148" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Do it manually once</text>

    <!-- Diamond 1: Repeated >3 times? -->
    <polygon points="500,192 600,240 500,288 400,240" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <text x="500" y="238" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600" text-anchor="middle">Will you repeat</text>
    <text x="500" y="252" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600" text-anchor="middle">it >3 times?</text>

    <!-- End oval: One-off -->
    <rect x="720" y="216" width="160" height="48" rx="24" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <text x="800" y="240" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">One-off</text>
    <text x="800" y="254" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">keep manual</text>

    <!-- Diamond 2: Reusable across projects? -->
    <polygon points="500,328 600,376 500,424 400,376" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <text x="500" y="374" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600" text-anchor="middle">Reusable across</text>
    <text x="500" y="388" fill="var(--color-ink, #1d2129)" font-size="11" font-weight="600" text-anchor="middle">projects?</text>

    <!-- End oval: CLAUDE.md note -->
    <rect x="720" y="352" width="160" height="48" rx="24" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <text x="800" y="376" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">CLAUDE.md note</text>
    <text x="800" y="390" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">project-scoped</text>

    <!-- End oval: Write a skill (coral focal) -->
    <rect x="420" y="464" width="160" height="56" rx="28" fill="var(--color-accent-tint, rgba(217,83,30,0.08))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
    <text x="500" y="492" fill="var(--color-ink, #1d2129)" font-size="12" font-weight="600" text-anchor="middle">Write a skill</text>
    <text x="500" y="508" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">reusable + assets</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
    <text x="72" y="582" fill="var(--color-muted, #374151)" font-size="8.5">Start / end (oval)</text>

    <rect x="220" y="572" width="24" height="12" rx="2" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <text x="252" y="582" fill="var(--color-muted, #374151)" font-size="8.5">Step (rectangle)</text>

    <polygon points="412,578 424,572 436,578 424,584" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <text x="448" y="582" fill="var(--color-muted, #374151)" font-size="8.5">Decision (diamond)</text>

    <line x1="604" y1="580" x2="632" y2="580" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#flow-arrow-accent)"/>
    <text x="640" y="582" fill="var(--color-muted, #374151)" font-size="8.5">Happy path</text>

    <line x1="768" y1="580" x2="796" y2="580" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <text x="804" y="582" fill="var(--color-muted, #374151)" font-size="8.5">Branch</text>
  </svg>
