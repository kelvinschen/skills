<svg class="diagram-canvas" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc">
  <title id="state-title">Article lifecycle</title>
  <desc id="state-desc">State machine showing an article moving from Draft through In Review and Published to Archived, including rejection and revision.</desc>
    <defs>
      <pattern id="state-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
      </pattern>
      <marker id="state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-muted, #374151)"/></marker>
      <marker id="state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--color-accent, #d9531e)"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
    <rect width="100%" height="100%" fill="url(#state-dots)" opacity="0.55"/>

    <!-- Transitions (drawn first) -->
    <!-- Start → Draft -->
    <line x1="68" y1="200" x2="120" y2="200" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#state-arrow)"/>
    <!-- Draft → In Review -->
    <line x1="280" y1="200" x2="340" y2="200" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#state-arrow)"/>
    <!-- In Review → Published (coral — happy path) -->
    <line x1="500" y1="200" x2="560" y2="200" stroke="var(--color-accent, #d9531e)" stroke-width="1.4" marker-end="url(#state-arrow-accent)"/>
    <!-- Published → Archived (down) -->
    <line x1="640" y1="240" x2="640" y2="300" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#state-arrow)"/>
    <!-- Archived → End (down) -->
    <line x1="640" y1="400" x2="640" y2="432" stroke="var(--color-muted, #374151)" stroke-width="1.2" marker-end="url(#state-arrow)"/>
    <!-- In Review → Draft (curved back up-and-left) -->
    <path d="M 420 160 C 420 96, 200 96, 200 160" fill="none" stroke="var(--color-muted, #374151)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#state-arrow)"/>

    <!-- Transition labels -->
    <text x="94" y="194" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">CREATE</text>

    <text x="312" y="194" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">SUBMIT</text>

    <text x="530" y="194" fill="var(--color-accent, #d9531e)" font-size="8" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

    <text x="648" y="274" fill="var(--color-muted, #374151)" font-size="8" text-anchor="start" letter-spacing="0.08em">EXPIRE</text>

    <text x="648" y="426" fill="var(--color-muted, #374151)" font-size="8" text-anchor="start" letter-spacing="0.08em">PURGE</text>

    <!-- Reject label on curved path -->
    <text x="316" y="88" fill="var(--color-muted, #374151)" font-size="8" text-anchor="middle" letter-spacing="0.08em">REJECT · REVISE</text>

    <!-- Start dot (filled ink) -->
    <circle cx="60" cy="200" r="6" fill="var(--color-ink, #1d2129)"/>

    <!-- State: Draft -->
    <rect x="120" y="160" width="160" height="80" rx="8" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <rect x="128" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.40)" stroke-width="0.8"/>
    <text x="148" y="177" fill="var(--color-ink, #1d2129)" font-size="7" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="200" y="208" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600" text-anchor="middle">Draft</text>
    <text x="200" y="224" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">unpublished</text>

    <!-- State: In Review -->
    <rect x="340" y="160" width="160" height="80" rx="8" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <rect x="348" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.40)" stroke-width="0.8"/>
    <text x="368" y="177" fill="var(--color-ink, #1d2129)" font-size="7" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="420" y="208" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600" text-anchor="middle">In Review</text>
    <text x="420" y="224" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">awaiting approval</text>

    <!-- State: Published (focal coral) -->
    <rect x="560" y="160" width="160" height="80" rx="8" fill="var(--color-accent-tint, rgba(217,83,30,0.08))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
    <rect x="568" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(217,83,30,0.50)" stroke-width="0.8"/>
    <text x="588" y="177" fill="var(--color-accent, #d9531e)" font-size="7" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="640" y="208" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600" text-anchor="middle">Published</text>
    <text x="640" y="224" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">live on site</text>

    <!-- State: Archived -->
    <rect x="560" y="300" width="160" height="100" rx="8" fill="rgba(30,41,59,0.05)" stroke="var(--color-muted, #374151)" stroke-width="1"/>
    <rect x="568" y="308" width="40" height="12" rx="2" fill="transparent" stroke="rgba(55,65,81,0.50)" stroke-width="0.8"/>
    <text x="588" y="317" fill="var(--color-muted, #374151)" font-size="7" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="640" y="348" fill="var(--color-ink, #1d2129)" font-size="14" font-weight="600" text-anchor="middle">Archived</text>
    <text x="640" y="364" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">noindex · hidden</text>
    <text x="640" y="382" fill="var(--color-muted, #374151)" font-size="9" text-anchor="middle">redirect retained</text>

    <!-- End ring dot -->
    <circle cx="640" cy="440" r="8" fill="none" stroke="var(--color-ink, #1d2129)" stroke-width="1"/>
    <circle cx="640" cy="440" r="5" fill="var(--color-ink, #1d2129)"/>
  </svg>
