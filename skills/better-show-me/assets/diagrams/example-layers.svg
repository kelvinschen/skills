<svg class="diagram-canvas" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">AI application stack</title>
  <desc id="layers-desc">Five abstraction layers from model weights to user interface, with the agent harness highlighted as the focal layer.</desc>
  <defs>
    <pattern id="layers-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="var(--color-paper, #f4f5f7)"/>
  <rect width="100%" height="100%" fill="url(#layers-dots)" opacity="0.55"/>

  <!-- Direction axis -->
  <text class="mono" x="44" y="64" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">ABSTRACTION</text>
  <line x1="76" y1="78" x2="76" y2="398" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))" stroke-width="1"/>
  <polygon points="72,78 80,78 76,70" fill="var(--color-muted, #374151)"/>
  <text class="mono" x="50" y="416" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">SILICON</text>

  <!-- Stack silhouette and layers -->
  <rect x="128" y="78" width="824" height="320" rx="4" fill="var(--color-paper-card, #ffffff)" stroke="var(--color-rule-solid, rgba(55,65,81,0.28))" stroke-width="1"/>

  <rect x="128" y="78" width="824" height="64" rx="4" fill="var(--color-paper-card, #ffffff)"/>
  <rect x="128" y="134" width="824" height="8" fill="var(--color-paper-card, #ffffff)"/>
  <text class="mono" x="148" y="115" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.14em">L5</text>
  <text x="260" y="117" fill="var(--color-ink, #1d2129)" font-size="16" font-weight="600">UI surface</text>
  <text class="mono" x="932" y="117" fill="var(--color-muted, #374151)" font-size="10" text-anchor="end">chat · editor · canvas</text>

  <!-- Focal layer -->
  <rect x="128" y="142" width="824" height="64" fill="var(--color-accent-tint, rgba(217,83,30,0.09))" stroke="var(--color-accent, #d9531e)" stroke-width="1"/>
  <text class="mono" x="148" y="179" fill="var(--color-accent, #d9531e)" font-size="8" font-weight="600" letter-spacing="0.14em">L4</text>
  <text x="260" y="181" fill="var(--color-ink, #1d2129)" font-size="16" font-weight="600">Agent harness</text>
  <text class="mono" x="932" y="181" fill="var(--color-accent, #d9531e)" font-size="10" text-anchor="end">tools · memory · loop</text>

  <rect x="128" y="206" width="824" height="64" fill="var(--color-paper-card, #ffffff)"/>
  <line x1="128" y1="270" x2="952" y2="270" stroke="var(--color-rule, rgba(30,41,59,0.14))" stroke-width="1"/>
  <text class="mono" x="148" y="243" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.14em">L3</text>
  <text x="260" y="245" fill="var(--color-ink, #1d2129)" font-size="16" font-weight="600">Prompt layer</text>
  <text class="mono" x="932" y="245" fill="var(--color-muted, #374151)" font-size="10" text-anchor="end">system · examples · cache</text>

  <rect x="128" y="270" width="824" height="64" fill="rgba(30,41,59,0.025)"/>
  <line x1="128" y1="334" x2="952" y2="334" stroke="var(--color-rule, rgba(30,41,59,0.14))" stroke-width="1"/>
  <text class="mono" x="148" y="307" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.14em">L2</text>
  <text x="260" y="309" fill="var(--color-ink, #1d2129)" font-size="16" font-weight="600">SDK / client</text>
  <text class="mono" x="932" y="309" fill="var(--color-muted, #374151)" font-size="10" text-anchor="end">auth · retry · streaming</text>

  <rect x="128" y="334" width="824" height="64" rx="4" fill="rgba(30,41,59,0.045)"/>
  <rect x="128" y="334" width="824" height="8" fill="rgba(30,41,59,0.045)"/>
  <text class="mono" x="148" y="371" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.14em">L1</text>
  <text x="260" y="373" fill="var(--color-ink, #1d2129)" font-size="16" font-weight="600">Model weights</text>
  <text class="mono" x="932" y="373" fill="var(--color-muted, #374151)" font-size="10" text-anchor="end">inference · context · tokens</text>

  <text class="mono" x="128" y="446" fill="var(--color-muted, #374151)" font-size="8" letter-spacing="0.18em">FOCAL LAYER</text>
  <text x="246" y="446" fill="var(--color-muted, #374151)" font-size="9" font-style="italic">The harness turns model calls into a product through tools, memory, and control flow.</text>
</svg>
